<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f73">
<title>Headache Diary</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script>try{var s=JSON.parse(localStorage.getItem("hd.settings")||"{}");document.documentElement.dataset.theme=s.followSystem?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":(s.lightTheme||"paper")):(s.theme||"paper");document.documentElement.dataset.text=s.text||"normal"}catch(e){}</script>
</head>
<body>
<div id="app"><p class="boot">Loading your diary…</p></div>
<dialog id="reason" aria-labelledby="reason-title">
  <form method="dialog" id="reason-form" novalidate>
    <h2 id="reason-title">Remove this entry?</h2>
    <p class="warn">Changes to the diary are recorded.</p>
    <label for="reason-text">Reason for removing it</label>
    <input id="reason-text" type="text" autocomplete="off" placeholder="e.g. tapped by mistake">
    <p class="error" id="reason-error" role="alert" hidden>Please type a short reason so we can keep your diary accurate.</p>
    <div class="row">
      <button type="button" class="btn quiet" id="reason-cancel">Keep it</button>
      <button type="submit" class="btn danger" id="reason-ok">Remove</button>
    </div>
  </form>
</dialog>
<noscript>Headache Diary needs JavaScript turned on.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
